# Bundled default overrides for docker-scanner.
#
# By default, docker-scanner gets all version information directly from
# container registries. Override entries are only needed for images where
# the registry doesn't expose usable version tags.
#
# To add overrides, create your own file at:
#   $XDG_CONFIG_HOME/docker-scanner/overrides.yml
#   ~/.config/docker-scanner/overrides.yml
# or pass --overrides PATH on the command line.

overrides: []
